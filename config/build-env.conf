#
# Definition of the isolated ISO build environment (container/Containerfile).
#
# Format: KEY=value, one per line, no quotes, no spaces around '='.
# Parsed by scripts/build-in-container.sh, scripts/build.sh and the CI
# workflows; checked by scripts/validate.sh.

# Arch Linux base image, pinned by digest (multi-arch index; only linux/amd64
# is used). Resolve a new digest with:
#   docker buildx imagetools inspect docker.io/library/archlinux:base-devel
BASE_IMAGE=docker.io/library/archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1

# Full fingerprint of the CachyOS repository signing key. It matches the
# 'cachyos-trusted' file of the cachyos-keyring package in
# https://github.com/CachyOS/CachyOS-PKGBUILDS (cachyos-keyring/).
CACHYOS_KEY_FPR=882DCFE48E2051D48E2562ABF3B607488DB35A47
CACHYOS_KEYSERVER=hkps://keyserver.ubuntu.com

# Mirror used for the [cachyos] repository inside the build container
# (same as upstream's .github/workflows/build.yml).
CACHYOS_MIRROR=https://mirror.cachyos.org/repo/$arch/$repo

# Local tag for the built container image.
IMAGE_NAME=localhost/linux-gaming-lab-builder

# Minimum free disk space (GiB) that scripts/build.sh expects in the work dir.
MIN_FREE_GIB=30
